[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "mesbahi-db-connectors"
version = "1.1.0"
description = "SQL connectors, bounded queries and transactional data workflows"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["SQLAlchemy>=2,<3", "pandas>=2.2,<3", "python-dotenv>=1,<2"]

[project.optional-dependencies]
excel = ["openpyxl>=3.1,<4"]
postgres = ["psycopg2-binary>=2.9,<3"]
mysql = ["PyMySQL>=1.1,<2", "mysql-connector-python>=8.3,<10"]
supabase = ["supabase>=2.4,<3", "psycopg2-binary>=2.9,<3"]
reports = ["openpyxl>=3.1,<4", "matplotlib>=3.8,<4", "plotly>=5.20,<7"]
dev = ["pytest>=8,<10", "build>=1,<2"]

[tool.setuptools.packages.find]
include = ["db_connection*", "queries*", "data_processing*", "utils*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
